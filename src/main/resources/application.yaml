spring:
  application:
    name: pagination-cursor-keyset

  datasource:
    url: jdbc:postgresql://localhost:5432/myappdb
    username: appuser
    password: appsecret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect